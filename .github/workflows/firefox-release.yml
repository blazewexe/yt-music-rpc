name: Release Firefox extension

on:
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag to build, for example v1.3.3"
        required: true
        type: string

permissions:
  contents: write

jobs:
  release:
    name: Build and publish Firefox package
    runs-on: ubuntu-latest
    env:
      RELEASE_TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Validate release version
        shell: bash
        run: |
          set -euo pipefail
          version="$(node -p "require('./manifest.json').version")"
          expected_tag="v${version}"

          if [[ "$RELEASE_TAG" != "$expected_tag" ]]; then
            echo "Release tag $RELEASE_TAG does not match manifest version $version (expected $expected_tag)." >&2
            exit 1
          fi

      - name: Prepare Firefox source
        shell: bash
        run: |
          set -euo pipefail
          rm -rf firefox-source
          mkdir firefox-source
          rsync -a \
            --exclude ".git/" \
            --exclude ".github/" \
            --exclude "dist/" \
            --exclude "firefox-source/" \
            ./ firefox-source/
          node <<'NODE'
          const fs = require('fs');
          const path = 'firefox-source/manifest.json';
          const manifest = JSON.parse(fs.readFileSync(path, 'utf8'));
          manifest.background = { scripts: ['lastfm.js', 'background.js'] };
          fs.writeFileSync(path, `${JSON.stringify(manifest, null, 2)}\n`);
          NODE

      - name: Lint extension
        run: npx --yes web-ext@8 lint --source-dir firefox-source --warnings-as-errors

      - name: Build XPI
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dist
          npx --yes web-ext@8 build \
            --source-dir firefox-source \
            --artifacts-dir dist \
            --overwrite-dest \
            --filename "yt-music-rpc-${RELEASE_TAG#v}.xpi"

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$RELEASE_TAG" \
            "dist/yt-music-rpc-${RELEASE_TAG#v}.xpi" \
            --title "yt-music-rpc ${RELEASE_TAG#v}" \
            --generate-notes

name: Release Firefox extension

on:
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag to build, for example v1.3.0"
        required: true
        type: string

permissions:
  contents: write

jobs:
  release:
    name: Build and publish Firefox package
    runs-on: ubuntu-latest
    env:
      RELEASE_TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Validate release version
        shell: bash
        run: |
          set -euo pipefail
          version="$(node -p "require('./manifest.json').version")"
          expected_tag="v${version}"

          if [[ "$RELEASE_TAG" != "$expected_tag" ]]; then
            echo "Release tag $RELEASE_TAG does not match manifest version $version (expected $expected_tag)." >&2
            exit 1
          fi

      - name: Lint extension
        run: npx --yes web-ext@8 lint --source-dir . --warnings-as-errors

      - name: Build XPI
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dist
          npx --yes web-ext@8 build \
            --source-dir . \
            --artifacts-dir dist \
            --overwrite-dest \
            --filename "yt-music-rpc-${RELEASE_TAG#v}.xpi"

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$RELEASE_TAG" \
            "dist/yt-music-rpc-${RELEASE_TAG#v}.xpi" \
            --title "yt-music-rpc ${RELEASE_TAG#v}" \
            --generate-notes
